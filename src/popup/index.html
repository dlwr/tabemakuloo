<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Tabemakuloo</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --focus: #2f6fdb;
      --accent: #001935;
      --accent-fg: #ffffff;
      --error: #c62828;
      --success: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1f24;
        --fg: #e6edf3;
        --muted: #8d96a0;
        --border: #3d444d;
        --focus: #6ea2ff;
        --accent: #e6edf3;
        --accent-fg: #1c1f24;
        --error: #ff7b72;
        --success: #3fb950;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      width: 360px;
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Segoe UI', sans-serif;
    }
    .source { margin-bottom: 12px; }
    #title {
      width: 100%;
      padding: 4px 0;
      border: none;
      border-bottom: 1px solid transparent;
      background: transparent;
      color: var(--fg);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
    }
    #title:hover { border-bottom-color: var(--border); }
    #title:focus { outline: none; border-bottom-color: var(--focus); }
    #url {
      display: block;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .field { margin-bottom: 10px; }
    .field label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 12px;
    }
    textarea, input[type="text"]:not(#title) {
      width: 100%;
      padding: 7px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--fg);
      font: inherit;
    }
    textarea { resize: vertical; }
    #quote { min-height: 96px; }
    #description { min-height: 44px; }
    textarea:focus, input[type="text"]:not(#title):focus {
      outline: none;
      border-color: var(--focus);
    }
    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }
    #status { min-width: 0; font-size: 12px; overflow-wrap: anywhere; }
    #status.error { color: var(--error); }
    #status.success { color: var(--success); }
    #status a { color: inherit; }
    #postBtn {
      flex-shrink: 0;
      padding: 7px 16px;
      border: none;
      border-radius: 4px;
      background: var(--accent);
      color: var(--accent-fg);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #postBtn:disabled { opacity: 0.5; cursor: default; }
    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 14px;
      margin: 0 0 10px;
      padding: 0;
      border: none;
    }
    .choices legend {
      float: left;
      width: 4em;
      padding: 0;
      color: var(--muted);
      font-size: 12px;
    }
    .choices label { display: inline-flex; align-items: center; gap: 4px; }
    .choices input { margin: 0; accent-color: var(--focus); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="source">
    <input type="text" id="title" aria-label="タイトル">
    <span id="url"></span>
  </div>

  <fieldset class="choices" id="kinds">
    <legend>形式</legend>
    <label><input type="radio" name="kind" value="quote">引用</label>
    <label><input type="radio" name="kind" value="link">リンク</label>
  </fieldset>

  <fieldset class="choices" id="services">
    <legend>投稿先</legend>
  </fieldset>

  <div class="field" id="quoteField">
    <label for="quote">引用</label>
    <textarea id="quote" placeholder="ページで選択したテキストが入ります"></textarea>
  </div>

  <div class="field">
    <label for="description">コメント</label>
    <textarea id="description"></textarea>
  </div>

  <div class="field">
    <label for="tags">タグ（カンマ区切り）</label>
    <input type="text" id="tags">
  </div>

  <div class="actions">
    <div id="status" role="status"></div>
    <button id="postBtn">投稿</button>
  </div>

  <script type="module" src="index.ts"></script>
</body>
</html>
