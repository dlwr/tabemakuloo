<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabemakuloo 設定</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --focus: #2f6fdb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1f24;
        --fg: #e6edf3;
        --muted: #8d96a0;
        --border: #3d444d;
        --focus: #6ea2ff;
      }
    }
    body {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Segoe UI', sans-serif;
    }
    h1 { font-size: 20px; margin: 0 0 24px; }
    h2 { font-size: 15px; margin: 0 0 4px; }
    p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
    table { border-collapse: collapse; }
    th, td {
      padding: 6px 16px 6px 0;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    th:first-child, td:first-child { text-align: left; }
    thead th { color: var(--muted); font-size: 12px; font-weight: normal; }
    input[type="checkbox"] { accent-color: var(--focus); }
    th img {
      width: 16px;
      height: 16px;
      margin-right: 6px;
      border-radius: 3px;
      vertical-align: -3px;
    }
    #status { min-height: 1.6em; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <h1>Tabemakuloo 設定</h1>

  <section>
    <h2>既定の投稿先</h2>
    <p>形式ごとに、最初からチェックしておく投稿先を選びます。投稿時にポップアップで変えられます。</p>
    <table id="destinations"></table>
    <div id="status" role="status"></div>
  </section>

  <script type="module" src="index.ts"></script>
</body>
</html>
